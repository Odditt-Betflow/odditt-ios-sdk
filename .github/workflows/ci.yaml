name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app || true
      - name: SwiftFormat lint
        run: |
          brew install swiftformat
          swiftformat Sources Tests --lint
      - name: Build (macOS host)
        run: swift build
      - name: Test (logic)
        run: swift test
      - name: Build (iOS Simulator)
        run: xcodebuild -scheme OddittSDK -destination 'generic/platform=iOS Simulator' build
